[package]
name = "rust-inference-router"
version = "0.1.0"
edition = "2021"
authors = ["Jay Guwalani <jguwalan@umd.edu>"]
description = "Prefix-cache-aware LLM inference request router. Dynamo subsystem port."
license = "Apache-2.0"
rust-version = "1.82"

[[bin]]
name = "rust-inference-router"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
dashmap = "6.1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.5"
tempfile = "3.13"

[[bench]]
name = "routing_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
